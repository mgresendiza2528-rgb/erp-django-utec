{% extends "base.html" %}
{% block title %}Eliminar proveedor{% endblock %}
{% block nav_proveedores %}active{% endblock %}

{% block content %}
<div class="erp-page-title"><h2>Eliminar proveedor</h2></div>
<div class="erp-card" style="max-width:540px;">
    <div class="erp-alert-danger" style="margin-bottom:1.5rem;">
        <strong>Eliminar "{{ proveedor }}"?</strong>
        <p style="margin:.5rem 0 0;">Los productos asociados quedaran sin proveedor.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn-erp-danger">Si, eliminar</button>
            <a href="{% url 'proveedores:detalle' proveedor.pk %}" class="btn-erp-primary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
