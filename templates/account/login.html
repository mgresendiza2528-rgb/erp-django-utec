{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div style="max-width:420px;margin:2rem auto;padding:1.5rem;
            border:1px solid #2A3F58;border-left:5px solid #D4AF37;
            border-radius:12px;">
  <h2 style="text-align:center;">Iniciar sesión</h2>
  <form method="post" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    {% if redirect_field_value %}
    <input type="hidden" name="{{ redirect_field_name }}"
           value="{{ redirect_field_value }}">
    {% endif %}
    <button type="submit" style="width:100%;padding:.6rem;">Entrar</button>
  </form>
  <p style="text-align:center;margin-top:1rem;">¿No tienes cuenta? <a href="{% url 'account_signup' %}">Regístrate</a></p>
</div>
{% endblock %}
