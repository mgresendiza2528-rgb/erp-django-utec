{% extends "base.html" %}
{% block title %}Eliminar producto{% endblock %}
{% block nav_productos %}active{% endblock %}

{% block content %}
<div class="erp-page-title"><h2>Eliminar producto</h2></div>
<div class="erp-card" style="max-width:540px;">
    <div class="erp-alert-danger" style="margin-bottom:1.5rem;">
        <strong>Eliminar "{{ producto }}"?</strong>
        <p style="margin:.5rem 0 0;">Si el producto tiene ventas asociadas no podra eliminarse.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn-erp-danger">Si, eliminar</button>
            <a href="{% url 'productos:detalle' producto.pk %}" class="btn-erp-primary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
